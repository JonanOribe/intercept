<!-- User Account Management Mode -->
<div id="userAccountManagementMode" class="mode-content">
    <div class="section">
        <h3>User Account Management</h3>
        <p class="info-text" style="font-size: 11px; color: var(--text-dim); margin-bottom: 12px;">
            Update your account details, modify your password, or change your profile picture.
        </p>
    </div>

    <!-- Profile Picture & Quick Info -->
    <div class="section">
        <h3>Profile Picture</h3>
        <div style="display: flex; align-items: center; gap: 12px; margin-top: 8px;">
            <div style="width: 48px; height: 48px; border-radius: 50%; background: var(--bg-surface, #222); overflow: hidden; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border-color, #444);">
                <img id="accountPreviewImg" src="" alt="Avatar" style="width: 100%; height: 100%; object-fit: cover; display: none;" />
                <span id="accountAvatarPlaceholder" style="font-size: 12px; color: var(--text-dim);">IMG</span>
            </div>
            <div style="flex-grow: 1;">
                <input type="file" id="accountImageInput" accept="image/*" style="font-size: 11px; color: var(--text-dim); width: 100%;" />
            </div>
        </div>
    </div>

    <!-- Account Details (Name) -->
    <div class="section">
        <h3>Account Details</h3>
        <div style="margin-top: 6px;">
            <label for="accountNameInput" style="display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 4px;">Display Name</label>
            <input type="text" id="accountNameInput" placeholder="Enter new name" style="width: 100%; padding: 6px; font-size: 11px; background: var(--bg-input, #111); border: 1px solid var(--border-color, #444); color: inherit; border-radius: 4px;" />
        </div>
    </div>

    <!-- Password Modification -->
    <div class="section">
        <h3>Security</h3>
        <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 6px;">
            <div>
                <label for="accountCurrentPass" style="display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 4px;">Current Password</label>
                <input type="password" id="accountCurrentPass" placeholder="••••••••" style="width: 100%; padding: 6px; font-size: 11px; background: var(--bg-input, #111); border: 1px solid var(--border-color, #444); color: inherit; border-radius: 4px;" />
            </div>
            <div>
                <label for="accountNewPass" style="display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 4px;">New Password</label>
                <input type="password" id="accountNewPass" placeholder="••••••••" style="width: 100%; padding: 6px; font-size: 11px; background: var(--bg-input, #111); border: 1px solid var(--border-color, #444); color: inherit; border-radius: 4px;" />
            </div>
            <div>
                <label for="accountConfirmPass" style="display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 4px;">Confirm New Password</label>
                <input type="password" id="accountConfirmPass" placeholder="••••••••" style="width: 100%; padding: 6px; font-size: 11px; background: var(--bg-input, #111); border: 1px solid var(--border-color, #444); color: inherit; border-radius: 4px;" />
            </div>
        </div>
    </div>

    <!-- Actions -->
    <div class="section">
        <button class="run-btn" style="width: 100%; margin-top: 4px;" onclick="UserAccount.saveChanges()">
            Save Changes
        </button>
        <div id="accountFeedbackMsg" style="font-size: 11px; color: var(--text-dim); margin-top: 6px; text-align: center;"></div>
    </div>
</div>
